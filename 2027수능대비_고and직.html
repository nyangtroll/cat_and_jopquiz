            gap: 10px;

            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;

            background: #c6f6d5;
            border-color: #38a169;
            color: #22543d;
            font-weight: bold;
        }
        .btn.wrong {
            background: #fed7d7;
            border-color: #e53e3e;
            color: #742a2a;
        }
        .feedback {
            margin-top: 15px;
            font-weight: bold;
            padding: 12px;
            border-radius: 5px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .next-btn {
            margin-top: 20px;
            background: #667eea;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            display: none;
            font-weight: bold;
        }
        .next-btn:hover {
            background: #5a67d8;
        }

            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;

            background: #667eea;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
            text-align: center;

            background: #5a67d8;

    let currentQuiz = [];
    let currentQuestion = 0;
    let score = 0;
    let answered = false;
    let modeTitle = "";

   function startQuiz(type) {
        if (type === 'time') {
            currentQuiz = timeQuizData;
            modeTitle = "근로 시간 파트 (유연근로제 20제)";
        } else if (type === 'contract') {
            currentQuiz = contractQuizData;
            modeTitle = "도급 사업 파트 (고용보험 도급 사업 15제)";
        } else {
            currentQuiz = bankQuizData;
            modeTitle = "은행 파트 (일반 은행 업무 30제)";
        }

        currentQuestion = 0;
        score = 0;

        document.getElementById("menu-box").style.display = "none";
        document.getElementById("quiz-box").style.display = "block";
        document.getElementById("result-box").style.display = "none";
        document.getElementById("progress-bar").style.display = "block";
        document.getElementById("sub-title").innerText = modeTitle;

        loadQuiz();
    }


    function loadQuiz() {
        answered = false;
        const q = currentQuiz[currentQuestion];
        document.getElementById("question-text").innerText = q.question;
        document.getElementById("progress-bar").innerText = `문제 ${currentQuestion + 1} / ${currentQuiz.length}`;
        
        const optionsBox = document.getElementById("options-box");
        optionsBox.innerHTML = "";
        
        q.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.className = "btn";
            btn.innerText = opt;
            btn.onclick = () => selectOption(index);
            optionsBox.appendChild(btn);
        });

        document.getElementById("feedback-box").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
    }

    function selectOption(index) {
        if (answered) return;
        answered = true;

        const q = currentQuiz[currentQuestion];
        const buttons = document.getElementsByClassName("btn");
        const feedbackBox = document.getElementById("feedback-box");

        if (index === q.answer) {
            buttons[index].classList.add("correct");
            feedbackBox.style.background = "#c6f6d5";
            feedbackBox.style.color = "#22543d";
            feedbackBox.innerHTML = "정답입니다! 👏 " + q.explanation;
            score++;
        } else {
            buttons[index].classList.add("wrong");
            buttons[q.answer].classList.add("correct");
            feedbackBox.style.background = "#fed7d7";
            feedbackBox.style.color = "#742a2a";
            feedbackBox.innerHTML = "아쉽네요! 😅 " + q.explanation;
        }

        feedbackBox.style.display = "block";
        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < currentQuiz.length) {
            loadQuiz();
        } else {
            document.getElementById("quiz-box").style.display = "none";
            document.getElementById("result-box").style.display = "block";
            document.getElementById("progress-bar").style.display = "none";
            document.getElementById("final-score").innerText = `총 ${currentQuiz.length}문제 중 ${score}문제를 맞혔습니다! 훌륭합니다! 🎯`;
        }
    }

    function restartQuiz() {
        currentQuestion = 0;
        score = 0;
        document.getElementById("quiz-box").style.display = "block";
        document.getElementById("result-box").style.display = "none";
        document.getElementById("progress-bar").style.display = "block";
        loadQuiz();
    }

    function goHome() {
        document.getElementById("menu-box").style.display = "flex";
        document.getElementById("quiz-box").style.display = "none";
        document.getElementById("result-box").style.display = "none";
        document.getElementById("progress-bar").style.display = "none";
        document.getElementById("sub-title").innerText = "학습할 파트를 선택해 주세요";
    }
